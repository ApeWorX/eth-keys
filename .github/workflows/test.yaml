on: ["push", "pull_request"]

name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.10"

    - name: Run Ruff Lint
      run: uv run --extra coincurve --group lint --group test ruff check .

    - name: Run Ruff Format
      run: uv run --extra coincurve --group lint --group test ruff format --check .

    - name: Run mdformat
      run: uv run --group lint mdformat --check README.md

  type-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.10"

    - name: Run MyPy
      run: uv run --extra coincurve --group lint --group test mypy eth_keys

  core:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Core Tests
      run: uv run --group test pytest tests/core

  backends:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # No released coincurve version supports Python 3.14 yet.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      REQUIRE_COINCURVE: "True"

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Backend Tests
      run: uv run --extra coincurve --group test pytest tests/backends
